name: Rebuild collections

on:
  schedule:
    - cron: "17 21 * * *"      # every day ~02:47 IST
  workflow_dispatch:            # "Run workflow" button
  push:
    paths: ["tools/**"]         # rebuild when you edit favourites/catalogs

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python tools/build_tmdb.py
      - name: Commit if changed
        run: |
          git config user.name  "collections-bot"
          git config user.email "collections-bot@users.noreply.github.com"
          git add -A manifest.json catalog data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Daily rebuild $(date -u +%F)"
          git push
